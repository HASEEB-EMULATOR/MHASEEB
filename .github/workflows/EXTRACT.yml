name: EXTRACT SOURCE
on: workflow_dispatch
permissions: write-all
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: |
          ZIP=$(ls *.zip | head -1)
          unzip -o "$ZIP"
          rm -f "$ZIP"
          echo "files=$(find . -type f -not -path './.git/*' | wc -l)"

      - name: Commit and push
        run: |
          git config user.name extract-bot
          git config user.email extract-bot@users.noreply.github.com
          git add -A
          echo "staged: $(git diff --cached --name-only | wc -l) files"

          if git diff --cached --quiet; then
            echo "::error::NOTHING_STAGED - unzip produced no new files"
            exit 1
          fi

          git commit -m "extract full source M1-M8" || true

          OUT=$(git push origin HEAD:main 2>&1)
          RC=$?
          echo "$OUT"
          if [ $RC -ne 0 ]; then
            SHORT=$(echo "$OUT" | grep -iE "denied|403|permission|error|fatal" | head -2 | tr '\n' ' ')
            echo "::error::PUSH_FAILED rc=$RC :: $SHORT"
            exit 1
          fi
          echo "PUSH_OK"
