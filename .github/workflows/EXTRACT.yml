name: EXTRACT SOURCE
on: workflow_dispatch
permissions: write-all
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: |
          ls -la
          ZIP=$(ls *.zip | head -1)
          echo "zip=$ZIP"
          unzip -o "$ZIP"
          rm -f "$ZIP"
          echo "--- files now ---"
          find . -type f -not -path './.git/*' | wc -l

      - name: Show git state
        run: |
          git status --short | head -30
          echo "--- remote ---"
          git remote -v
          echo "--- branch ---"
          git branch --show-current

      - name: Commit and push (errors visible)
        run: |
          git config user.name extract-bot
          git config user.email extract-bot@users.noreply.github.com
          git add -A
          git commit -m "extract full source M1-M8"
          git push origin HEAD:main
